name: Tiny Factory validation and deployment

on:
  pull_request:
    branches: [main, v0.01, v0.02, v0.03, v0.04, v0.05, v0.06, v1.00]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the validated main build to the configured Roblox target
        required: true
        default: false
        type: boolean

concurrency:
  group: tiny-factory-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  validate:
    name: Validate Tiny Factory
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install pinned Luau test runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tools/luau
          curl --fail --location --retry 3 \
            https://github.com/luau-lang/luau/releases/download/0.737/luau-ubuntu.zip \
            -o .tools/luau.zip
          unzip -q .tools/luau.zip -d .tools/luau
          chmod +x .tools/luau/luau .tools/luau/luau-compile

      - name: Compile Luau sources and tests
        shell: bash
        run: .tools/luau/luau-compile -t1 $(find src tests -name '*.luau' -print)

      - name: Run all simulation and rules tests
        shell: bash
        run: |
          set -euo pipefail
          for test_file in tests/*.luau; do
            echo "Running $test_file"
            .tools/luau/luau "$test_file"
          done

  import_personal_island:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push'
    name: Import Higgsfield GLB and Roblox Model
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Check whether the map is already imported
        id: state
        shell: bash
        run: |
          set -euo pipefail
          if test -s src/maps/PersonalIsland.glb && grep -Eq 'AssetId = [1-9][0-9]*' src/shared/PersonalIslandAssetId.luau; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download exact Higgsfield GLB
        if: steps.state.outputs.ready != 'true'
        shell: bash
        run: |
          set -euo pipefail
          source_url=$(jq -r '.downloadUrl' docs/assets/personal-island-source.json)
          expected_bytes=$(jq -r '.expectedBytes' docs/assets/personal-island-source.json)
          curl --fail --location --retry 3 --silent --show-error "$source_url" \
            --output src/maps/PersonalIsland.glb
          actual_bytes=$(stat -c '%s' src/maps/PersonalIsland.glb)
          test "$actual_bytes" = "$expected_bytes" || {
            echo "Unexpected personal island size: $actual_bytes (expected $expected_bytes)"
            exit 1
          }

      - name: Upload GLB to Roblox Assets API
        if: steps.state.outputs.ready != 'true'
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          ROBLOX_UNIVERSE_ID: ${{ secrets.ROBLOX_UNIVERSE_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ROBLOX_API_KEY" || { echo "ROBLOX_API_KEY secret is missing"; exit 1; }
          test -n "$ROBLOX_UNIVERSE_ID" || { echo "ROBLOX_UNIVERSE_ID secret is missing"; exit 1; }

          creator_response=$(curl --fail --silent --show-error \
            "https://games.roblox.com/v1/games?universeIds=$ROBLOX_UNIVERSE_ID")
          creator_type=$(jq -r '.data[0].creator.type // empty' <<<"$creator_response")
          creator_id=$(jq -r '.data[0].creator.id // empty' <<<"$creator_response")
          test -n "$creator_type" || { echo "Could not resolve the Roblox universe creator type"; exit 1; }
          test -n "$creator_id" || { echo "Could not resolve the Roblox universe creator ID"; exit 1; }

          if [[ "$creator_type" == "Group" ]]; then
            creator_json=$(jq -nc --arg id "$creator_id" '{groupId: $id}')
          else
            creator_json=$(jq -nc --arg id "$creator_id" '{userId: $id}')
          fi
          request_json=$(jq -nc \
            --arg creator "$creator_json" \
            '{assetType:"Model", displayName:"Tiny Factory - Personal Island", description:"Higgsfield Tiny Factory personal island, revision 26.", creationContext:{creator:($creator | fromjson)}}')

          operation=$(curl --fail --silent --show-error \
            --request POST \
            --header "x-api-key: $ROBLOX_API_KEY" \
            --form-string "request=$request_json" \
            --form "fileContent=@src/maps/PersonalIsland.glb;type=model/gltf-binary" \
            "https://apis.roblox.com/assets/v1/assets")
          operation_path=$(jq -r '.path // empty' <<<"$operation")
          test -n "$operation_path" || { echo "Roblox asset upload did not return an operation path"; exit 1; }

          asset_id=""
          for attempt in $(seq 1 30); do
            status=$(curl --fail --silent --show-error \
              --header "x-api-key: $ROBLOX_API_KEY" \
              "https://apis.roblox.com/assets/v1/$operation_path")
            if [[ $(jq -r '.done // false' <<<"$status") == "true" ]]; then
              if jq -e '.error' >/dev/null <<<"$status"; then
                echo "Roblox asset operation failed"
                jq '.error' <<<"$status"
                exit 1
              fi
              asset_id=$(jq -r '.response.assetId // empty' <<<"$status")
              break
            fi
            sleep 10
          done
          test -n "$asset_id" || { echo "Roblox asset operation did not finish"; exit 1; }

          source_sha=$(sha256sum src/maps/PersonalIsland.glb | awk '{print $1}')
          cat > src/shared/PersonalIslandAssetId.luau <<EOF
--!strict
-- Generated by .github/workflows/import-personal-island.yml.
return {
	AssetId = $asset_id,
	SourceProjectId = "26b9c585-243d-4326-bb91-f48bcd5878fc",
	SourceRevision = 26,
	SourceEtag = "a25926c99bcaad87d4abd06ac976f83f",
	SourceSha256 = "$source_sha",
}
EOF
          jq -n \
            --arg assetId "$asset_id" \
            --arg sha "$source_sha" \
            --arg source "$(jq -r '.downloadUrl' docs/assets/personal-island-source.json)" \
            '{assetId:$assetId|tonumber, sourceSha256:$sha, sourceUrl:$source, higgsfieldRevision:26}' \
            > src/maps/PersonalIsland.roblox.json

      - name: Commit imported map and Roblox asset metadata
        if: steps.state.outputs.ready != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/maps/PersonalIsland.glb src/maps/PersonalIsland.roblox.json src/shared/PersonalIslandAssetId.luau
          git commit -m "feat: import personal island map asset"
          git push origin HEAD:main

  publish:
    name: Publish validated main build
    needs: [validate, import_personal_island]
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_dispatch' && inputs.publish == true) ||
       github.event_name == 'push')
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Set up Rokit toolchain
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          version: v1.2.0

      - name: Build Tiny Factory place
        shell: bash
        run: rojo build default.project.json --output TinyFactory.rbxlx

      - name: Verify Roblox target
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          ROBLOX_UNIVERSE_ID: ${{ secrets.ROBLOX_UNIVERSE_ID }}
          ROBLOX_PLACE_ID: ${{ secrets.ROBLOX_PLACE_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ROBLOX_API_KEY" || { echo "ROBLOX_API_KEY secret is missing"; exit 1; }
          test -n "$ROBLOX_UNIVERSE_ID" || { echo "ROBLOX_UNIVERSE_ID secret is missing"; exit 1; }
          test -n "$ROBLOX_PLACE_ID" || { echo "ROBLOX_PLACE_ID secret is missing"; exit 1; }
          curl --fail --silent --show-error \
            --header "x-api-key: $ROBLOX_API_KEY" \
            "https://apis.roblox.com/cloud/v2/universes/$ROBLOX_UNIVERSE_ID/places/$ROBLOX_PLACE_ID" \
            --output place-response.json

      - name: Publish Tiny Factory
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          ROBLOX_UNIVERSE_ID: ${{ secrets.ROBLOX_UNIVERSE_ID }}
          ROBLOX_PLACE_ID: ${{ secrets.ROBLOX_PLACE_ID }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if [[ "$attempt" -gt 1 ]]; then
              sleep $(( (attempt - 1) * 30 ))
            fi
            response_file="publish-response-$attempt.json"
            http_code=$(curl --silent --show-error \
              --output "$response_file" \
              --write-out "%{http_code}" \
              --request POST \
              --header "x-api-key: $ROBLOX_API_KEY" \
              --header "Content-Type: application/xml" \
              --data-binary @TinyFactory.rbxlx \
              "https://apis.roblox.com/universes/v1/$ROBLOX_UNIVERSE_ID/places/$ROBLOX_PLACE_ID/versions?versionType=Published")
            echo "Publish attempt $attempt: HTTP $http_code"
            if [[ "$http_code" -ge 200 && "$http_code" -lt 300 ]]; then
              exit 0
            fi
            if [[ "$http_code" != "409" && "$http_code" != "429" && ! "$http_code" =~ ^5 ]]; then
              cat "$response_file"
              exit 1
            fi
          done
          exit 1
